<script>
/* Deck 3 · How do LLMs pick the next word? (aka: How does learning work?)   — storyline v7 (session learn-5: no training in deck 3; learning from text = her training / inference / context slides)
   Built by build3.py: head.part + script3.part + tail.part (head.part is shared with decks 1 and 2 and is NOT edited).
   Her decisions (handoff-learn-2, session learn-3): Option 1 flow (the formula right after the score slide), section slides
   for Probabilities and Learning (introduced on the title slide; bigger circle + slightly bigger font), glow = option C
   (sentence colour + one dotted circle), chances told apart by shade, slide “How wrong is the line?” = her step control +
   labels next to their own students + overlapping gaps side by side, “Nudge the parameters downhill” = her drag (m 0–4,
   curve grey → purple where she has been, stays purple), score slide: free scores, lowest 1, old % faded next to the new %,
   the text part of Learning mirrors the line (training text · how wrong is the guess · nudge the weights · result),
   weighted wheel wording (aka sampling).
   Numbers (whole, made up): x = 3 (how far the blank points to jewellery); sparkly 3×3+1 = 10, shiny 2×3+0 = 6,
   pretty 1×3+0 = 3, loud 0×3+1 = 1 → 50 / 30 / 15 / 5 %. Training starts with weight 1, bias 2 for every word (25 % each).
   Same controls as decks 1 and 2: Back / Next change slides only; self-playing slides have ↻ Replay;
   step slides have her step control (‹ ▶ › + stops + “?”), click only. */
(function(){
var NS='http://www.w3.org/2000/svg';
var root=document.getElementById('root');
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag); if(attrs) for(var k in attrs) e.setAttribute(k,attrs[k]); (parent||root).appendChild(e); return e;}
function txt(s,attrs,parent){var e=el('text',attrs,parent); e.textContent=s; return e;}
function tsp(parent,s,cls){var t=document.createElementNS(NS,'tspan'); t.textContent=s; if(cls) t.setAttribute('class',cls); parent.appendChild(t); return t;}
function clamp(v){return v<0?0:v>1?1:v}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function eout(t){return 1-Math.pow(1-t,3)}
function R(P,a,b){return ease(clamp((P-a)/(b-a)))}
function lerp(a,b,t){return a+(b-a)*t}
function op(e,v){e.style.opacity=v<0.001?0:v; e.style.visibility=v<0.001?'hidden':''; e.style.pointerEvents=v<0.001?'none':'';}   /* '' = inherit: hidden slides stay hidden (no invisible text in a copy) */
function set(e,a){for(var k in a) e.setAttribute(k,a[k]);}
function tw(t){var w=t.getComputedTextLength?t.getComputedTextLength():0; return w||t.textContent.length*16;}
function ramp(t,a,d){return ease(clamp((t-a)/d));}   /* 0→1 from second a over d seconds */

/* arrow = line + triangle head (same as deck 2) */
function mkArrow(cls,parent,w){
  var g=el('g',{},parent);
  var l=el('line',{'class':cls.s,'stroke-width':w||4,'stroke-linecap':'round'},g);
  var h=el('path',{'class':cls.f},g);
  return {g:g,l:l,h:h,w:w||4};
}
function drawArrow(a,x1,y1,x2,y2,t){
  var ex=lerp(x1,x2,t), ey=lerp(y1,y2,t), dx=ex-x1, dy=ey-y1, L=Math.hypot(dx,dy);
  if(L<2){op(a.g,0);return;}
  a.g.style.visibility=''; a.g.style.opacity=1;
  var ux=dx/L, uy=dy/L, hl=Math.min(22+a.w, L*.6), hw=hl*.45;
  set(a.l,{x1:x1,y1:y1,x2:ex-ux*hl*.8,y2:ey-uy*hl*.8});
  var bx=ex-ux*hl, by=ey-uy*hl;
  set(a.h,{d:'M'+ex+' '+ey+'L'+(bx-uy*hw)+' '+(by+ux*hw)+'L'+(bx+uy*hw)+' '+(by-ux*hw)+'Z'});
}
var C={mut:{s:'s-mut',f:'mut'},link:{s:'s-link',f:'f-link'},no:{s:'s-no',f:'f-no'},yes:{s:'s-yes',f:'f-yes'}};

/* ------------------------------------------------------------------ */
/* SCENES. sec = part in the trail; sect = section slide; auto = seconds it plays by itself (+ ↻ Replay);   */
/* steps = her step control (click only). Pacing (her rule): every step ≥ 1.5 s, pauses ≥ 1 s.              */
/* ------------------------------------------------------------------ */
var SECS=['Question','Probabilities','Learning','Summary'];   /* v8: two parts (her S31) */
var PREV_DECK='2-homonyms.html#end';   /* Back on slide 1 (and ←) goes to the last slide of deck 2 */
var SC=[
 {id:'title',sec:-1,t:'',d:0},
 {id:'q1',  sec:0, t:'Which word comes next?', s:'Probability: the chance the model gives every possible word', d:1.0, auto:7.0},
 {id:'q2',  sec:0, t:'A different sentence, different probabilities', s:'The words before the blank move the blank’s vector', d:2.5, auto:7.0},
 {id:'secP',sec:1, t:'', d:1.0, sect:1},
 {id:'sc',  sec:1, t:'Where do the probabilities come from?', s:'Logits (aka scores): a word’s probability is its logit’s share of the total', d:1.0, auto:9.8},
 {id:'wheel',sec:1,t:'It spins a weighted wheel', s:'Sampling: a bigger slice is picked more often, not always', d:1.0, steps:['wheel','3 spins','top word'], sd:[4.0,10.5,1.5], trk:[800,790]},
 {id:'secL',sec:2, t:'', d:1.0, sect:2},
 {id:'lin', sec:2, t:'How does an LLM learn?', s:'Start small: a line with one weight (m) and one bias (c)', d:1.0, auto:4.5},
 {id:'err', sec:2, t:'How wrong is the line?', s:'Error: the gap between a real mark and the line', d:1.0, steps:['gaps','add up','total'], trk:[1200,790]},
 {id:'gd',  sec:2, t:'Nudge the parameters downhill', s:'Gradient descent: step downhill to the lowest total error', d:1.0},
 {id:'wts', sec:2, t:'How are the words weighted?', s:'Each word has its own weight and bias, like the line’s m and c', d:1.0, steps:['“sparkly”','“shiny”','“pretty”','“loud”'], trk:[800,790]},
 {id:'from',sec:2, t:'Where do the words’ weights come from?', s:'Gradient descent, the same way as the line’s m and c', d:1.0, steps:['the line','the words','more weights'], trk:[800,790]},
 {id:'sum', sec:3, t:'What You Learned', d:2.2}
];
var N=SC.length, S={};
SC.forEach(function(s,i){S[s.id]=i+1;});
var DUR=SC.map(function(s){return s.d;});
function IN(P,n,u0,u1){return R(P,n-2+u0,n-2+u1);}
function autoOf(i){return SC[i]&&SC[i].auto||0;}
function stepsOf(i){return SC[i]&&SC[i].steps?SC[i].steps.length:0;}
function vis(P,id,nextId){return IN(P,S[id],.05,.35)*(nextId?1-IN(P,S[nextId],0,.25):1);}

var KEYC={'engaged.':'no','phone.':'yes','ring.':'k','love':'mid'};
var WC={sparkly:'no',shiny:'no',pretty:'no',loud:'yes',catchy:'yes',annoying:'yes'};

  dragOn([o.hit,o.dot],function(){return settledOn('sc')&&tOf('sc')>=9.3;},function(x){var n=Math.round((x-BX-14)/BP); n=Math.max(MINS,Math.min(MAXS,n)); if(n!==SCR[k]){SCR[k]=n; dirty=true;}});
});
/* slide 10: drag the dot along the x-axis, m = 0…4 (whole numbers); every m it passes turns purple and stays purple */
function setGD(m){m=Math.max(0,Math.min(4,m)); if(m===GDm) return; var a=Math.min(m,GDm), b=Math.max(m,GDm); for(var q=a;q<=b;q++) GDseen[q]=1; GDm=m; dirty=true;}
dragOn([vHit,vDot,vBall],function(){return settledOn('gd');},function(x){setGD(Math.round((x-VA.x0)/VA.ux));});

/* ------------------------------------------------------------------ */
/* timeline + slide controls (Back / Next change the slide only)       */
/* ------------------------------------------------------------------ */
var anim=null;
var capK=document.getElementById('capK'), capT=document.getElementById('capT'), cap=document.getElementById('cap');
var prev=document.getElementById('prev'), next=document.getElementById('next'), count=document.getElementById('count'), dots=document.getElementById('dots');
var seen={0:1};
for(var d=0;d<N;d++){(function(d){var b=document.createElement('button'); b.type='button'; if(SC[d].sec>=0 && (d===0||SC[d-1].sec!==SC[d].sec)) b.classList.add('sec');   /* first slide of a trail part: bigger dot (session 4) */
   if(SC[d].sect) b.classList.add('sect');
  b.setAttribute('aria-label','Slide '+(d+1)+(SC[d].sec>=0?': '+SECS[SC[d].sec]:'')); b.addEventListener('click',function(){go(d);}); dots.appendChild(b);})(d);}
function trail(sec){
  capK.textContent='';
  SECS.forEach(function(s,i){
    if(i){capK.appendChild(document.createTextNode(' ')); var sp_=document.createElement('span'); sp_.className='sep'; sp_.textContent='›'; sp_.setAttribute('aria-hidden','true'); capK.appendChild(sp_); capK.appendChild(document.createTextNode(' '));}
    var e=document.createElement('span'); e.textContent=s; e.className=i<sec?'past':(i===sec?'now':'next');
    if(i===sec) e.setAttribute('aria-current','step');
    capK.appendChild(e);
  });
}
function ui(){
  var s=SC[cur];
  trail(s.sec); capT.textContent=cur===0?'':s.t;
  if(s.s){var sm=document.createElement('small'); sm.textContent=s.s; capT.appendChild(sm);}
  cap.style.visibility=cur===0?'hidden':'visible';
  cap.classList.remove('fade'); void cap.offsetWidth; cap.classList.add('fade');
  prev.disabled=false; prev.innerHTML=cur===0?'← <span class="lt">Back 2: </span>Homonyms':'← Back';
  next.disabled=cur===N-1;
  count.textContent=(cur+1)+' / '+N;
  svgEl.classList.toggle('turn',turnSlide(cur));
  [].forEach.call(dots.children,function(b,i){if(i===cur) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); b.classList.toggle('seen',!!seen[i]);});
  if(stepsOf(cur)) layoutTrack(cur); trkSig='';
  try{history.replaceState(null,'','#'+(cur+1));}catch(e){}
}
function go(t){
  if(t<0){location.href=PREV_DECK; return;}
  t=Math.min(N-1,t); if(t===cur&&!anim) return;
  closeHelp();
  var fwd=t===cur+1&&Math.abs(P-cur)<1e-6;
  var dur=reduce?.25:(fwd?DUR[t]:(t<cur?.6:.9));
  if(t===S.sc-1&&cur!==t){SCR=BASE.slice(); scSig='';}   /* the score slide starts from 10 / 6 / 3 / 1 */
  if(t===S.gd-1&&cur!==t) gdReset();                     /* the drag slide starts at m = 0, curve grey */
  if(!turnSlide(t)) viewHome(400);
  spLeave={i:cur,v:sp};
  anim={from:P,to:t,start:performance.now(),dur:dur*1000,lin:fwd};
  cur=t; seen[t]=1;
  auFreeze=null; auStart=fwd?performance.now()+dur*1000+150:-1e9;
  spAnim=null; playing=false; waitUntil=0;
  sp=stepsOf(t)?(fwd?0:stepsOf(t)):0;   /* arriving with Next: step 0 · with Back or a dot: finished */
  ui();
}
function step(now){
  if(anim){var k=clamp((now-anim.start)/anim.dur); P=lerp(anim.from,anim.to,anim.lin?k:ease(k)); if(k>=1){P=anim.to; anim=null; dirty=true;}}
  if(spAnim && !spAnim.pausedAt){
    var u=clamp((now-spAnim.start)/spAnim.dur);
    sp=lerp(spAnim.from,spAnim.to,spAnim.eased?ease(u):u); dirty=true;
    if(u>=1){ sp=spAnim.to; spAnim=null; if(playing) waitUntil=now+PAUSE*1000; }
  }
  if(playing && !anim && !spAnim && stepsOf(cur)){
    if(sp>=stepsOf(cur)-1e-6){ playing=false; dirty=true; }
    else if(now>=waitUntil){ waitUntil=0; var kk=Math.floor(sp+1e-6)+1; startSp(kk,reduce?.25:stepDur(cur,kk),false); }
  }
  if(autoOf(cur)&&now<auStart+autoOf(cur)*1000+100) dirty=true;
  if(P!==lastP||anim||vAnim||dirty){render(P); lastP=P; dirty=false;}
  requestAnimationFrame(step);
}
prev.addEventListener('click',function(){go(cur-1);});
next.addEventListener('click',function(){go(cur+1);});
document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  var k=e.key;
  if(!help.hidden && k!=='Tab' && k!=='Shift'){ if(!(k==='Enter'||k===' ')||!help.contains(e.target)){ e.preventDefault(); closeHelp(); return; } }
  if(e.target.closest&&e.target.closest('.rbtn')&&(k==='Enter'||k===' ')) return;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||(k==='Enter'&&e.target===document.body)){e.preventDefault(); go(cur+1);}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault(); go(cur-1);}
  else if(k==='Home'){go(0);} else if(k==='End'){go(N-1);}
  else if(k==='f'||k==='F'){fs();}
});
function fs(){try{if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();}catch(e){}}
document.getElementById('fsBtn').addEventListener('click',fs);
var rootEl=document.documentElement, tb=document.getElementById('themeBtn');
function isDark(){var t=rootEl.getAttribute('data-theme'); if(t) return t==='dark'; return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;}
function tl_(){tb.setAttribute('aria-label',isDark()?'Switch to light mode':'Switch to dark mode');}
tb.addEventListener('click',function(){var t=isDark()?'light':'dark'; rootEl.setAttribute('data-theme',t); try{localStorage.setItem('cps845-theme',t);}catch(e){} tl_();});
tl_();
function layoutAll(){LAYOUT.forEach(function(f){f();}); lastP=-1;}
var hs=(location.hash||'').slice(1), h=hs==='end'?N:parseInt(hs,10);
if(h>=1&&h<=N){cur=h-1; P=cur; sp=stepsOf(cur); for(var s=0;s<=cur;s++) seen[s]=1;}
/* testing hooks: __setP(p) slide index p finished · __au(u) freeze a self-playing slide · __sp(v) step value · __scores([..]) · __gd(m) · __view(yaw,pitch) */
window.__setP=function(p){anim=null; spAnim=null; spLeave=null; playing=false; P=p; cur=Math.round(p); sp=stepsOf(cur); auFreeze=null; auStart=-1e9; ui(); render(P); lastP=P;};
window.__au=function(u){auFreeze=u; render(P); lastP=P;};
window.__sp=function(v){spAnim=null; playing=false; sp=v; trkSig=''; render(P); lastP=P;};
window.__scores=function(a){SCR=a.slice(); scSig=''; render(P); lastP=P;};
window.__gd=function(m){setGD(m); render(P); lastP=P;};
window.__view=function(y,p){vAnim=null; view.yaw=y; view.pitch=p; vTouched=!!(y||p); render(P); lastP=P;};
window.__help=function(o){if(o) openHelp(); else closeHelp();};
window.__state=function(){return {cur:cur,P:P,au:+auOf(cur).toFixed(2),sp:sp,playing:playing,anim:!!anim,scores:SCR.slice(),gd:GDm,gdSeen:Object.keys(GDseen).map(Number),view:[view.yaw,view.pitch]};};
window.__S=S;
layoutAll();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layoutAll);
ui(); render(P); requestAnimationFrame(step);
})();
</script>
</script>
