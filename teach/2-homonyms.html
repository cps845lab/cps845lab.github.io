   Session 10: slide 2 underline + words one after the other · slides 5–8 follow 3Blue1Brown’s explanation of
   attention: “ring” has ONE initial embedding (same spot in every sentence); attention adds one change to it, built from
   the words it listens to = the refined embedding. Session 11: slides 5–8 all play by themselves (+ ↻ Replay); slides 9–11 = how attention picks its words (scores → shares → learned by practice); slide 12 = summary;
   Back / Next change SLIDES only. */
(function(){
var NS='http://www.w3.org/2000/svg';
var root=document.getElementById('root');
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag); if(attrs) for(var k in attrs) e.setAttribute(k,attrs[k]); (parent||root).appendChild(e); return e;}
function txt(s,attrs,parent){var e=el('text',attrs,parent); e.textContent=s; return e;}
function clamp(v){return v<0?0:v>1?1:v}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function R(P,a,b){return ease(clamp((P-a)/(b-a)))}
function lerp(a,b,t){return a+(b-a)*t}
function op(e,v){e.style.opacity=v<0.001?0:v; e.style.visibility=v<0.001?'hidden':'visible'; e.style.pointerEvents=v<0.001?'none':'';}
function set(e,a){for(var k in a) e.setAttribute(k,a[k]);}

/* arrow = line + triangle head, drawn from (x1,y1) toward (x2,y2); t = how much is drawn */
function mkArrow(cls,parent,w){
  var g=el('g',{},parent);
  var l=el('line',{'class':cls.s,'stroke-width':w||4,'stroke-linecap':'round'},g);
  var h=el('path',{'class':cls.f},g);
  return {g:g,l:l,h:h,w:w||4};
}
function drawArrow(a,x1,y1,x2,y2,t){
  var ex=lerp(x1,x2,t), ey=lerp(y1,y2,t), dx=ex-x1, dy=ey-y1, L=Math.hypot(dx,dy);
  if(L<2){op(a.g,0);return;}
  a.g.style.visibility='visible'; a.g.style.opacity=1;
  var ux=dx/L, uy=dy/L, hl=Math.min(22+a.w, L*.6), hw=hl*.45;
  set(a.l,{x1:x1,y1:y1,x2:ex-ux*hl*.8,y2:ey-uy*hl*.8});
  var bx=ex-ux*hl, by=ey-uy*hl;
  set(a.h,{d:'M'+ex+' '+ey+'L'+(bx-uy*hw)+' '+(by+ux*hw)+'L'+(bx+uy*hw)+' '+(by-ux*hw)+'Z'});

var C={no:{s:'s-no',f:'f-no'},mid:{s:'s-mid',f:'f-mid'},yes:{s:'s-yes',f:'f-yes'},mut:{s:'s-mut',f:'mut'},k:{s:'s-k',f:'f-k'},ghost:{s:'s-ghost',f:'f-ghost'}};

var PREV_DECK='1-embedding.html#end';   /* Back on slide 1 (and ←) goes to the last slide of deck 1 */
var SC=[
 {id:'title',sec:-1,t:'',d:0},
 {id:'q',  sec:0, t:'“Ring” is a homonym', s:'On its own, you can’t tell which meaning', d:3.0},
 {id:'b',  sec:1, t:'Vectors alone can’t do it', s:'Attention lets the context change the vector', d:1.4},
 {id:'s',  sec:2, t:'Two sentences, one “ring”', s:'Only the first sentence changes', d:1.4},

 {id:'a1', sec:4, t:'“Ring” with attention: engaged', s:'Refined embedding: a new vector for this sentence (aka contextual embedding)', d:1.0, auto:4.8, parts:3},
 {id:'a2', sec:5, t:'“Ring” with attention: phone', s:'A different sentence adds a different change', d:1.0, auto:4.8, parts:3},

    set(it.el,{x:it.x+best.c[0],y:it.y+best.c[1],'text-anchor':best.c[2]}); boxes.push([best.b[0]-5,best.b[1]-5,best.b[2]+5,best.b[3]+5]);   /* keep a gap between labels */

}
function headBox(a,b,w){   /* box around an arrowhead (same size rule as drawArrow) */
  var L=Math.hypot(b.x-a.x,b.y-a.y)||1, hl=Math.min(22+w,L*.6), hw=hl*.45+3, bx=b.x-(b.x-a.x)/L*hl, by=b.y-(b.y-a.y)/L*hl;

function arrowSeg(a,b,segs,dots){segs.push([a.x,a.y,b.x,b.y]); dots.push(headBox(a,b,6));}

  var segs=[], dots=[], boxes=[], id=SC[i].id, o=P3([0,0,0]), ra=P3(RING), items=[];
  AX_END.forEach(function(e){var p=P3(e); segs.push([o.x,o.y,p.x,p.y]); dots.push(headBox(o,p,3));});
  REF.forEach(function(r){var p=P3(r.v); dots.push([p.x-13,p.y-13,p.x+13,p.y+13]);});
  arrowSeg(o,ra,segs,dots); dots.push([ra.x-15,ra.y-15,ra.x+15,ra.y+15]);
  SENT.forEach(function(s){ var n=P3(s.NEW);
    if(id===SC[s.att-1].id){ arrowSeg(ra,n,segs,dots); arrowSeg(o,n,segs,dots); dots.push([n.x-17,n.y-17,n.x+17,n.y+17]);
      items.push({el:s.nL,x:n.x,y:n.y,c:ptC(24,4)},{el:s.dL,x:(ra.x+n.x)/2,y:(ra.y+n.y)/2,c:arrC(ra,n,24)}); }
    if(id==='cmp'){ arrowSeg(ra,n,segs,dots); dots.push([n.x-17,n.y-17,n.x+17,n.y+17]); items.push({el:s.cL,x:n.x,y:n.y,c:ptC(24,4)}); if(s.tag==='phone') arrowSeg(o,n,segs,dots); }

/* ------------------------------------------------------------------ */
/* render(P): the slide position P + the step position of each slide   */
/* ------------------------------------------------------------------ */
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var cur=0, P=0, lastP=-1;
var spLeave=null, dirty=true;
var auStart=-1e9, auFreeze=null;   /* auto slides: the animation starts once the slide has arrived; ↻ Replay restarts it */
function auOf(i){   /* 0…1 progress of the one animation on auto slide i */
  if(!autoOf(i)) return 0; if(i!==cur) return i<cur?1:0; if(auFreeze!==null) return auFreeze;
  return clamp((performance.now()-auStart)/(autoOf(i)*1000));
}
/* slides 6 / 7 play their 3 parts one after another: bars 1.0 s · pause .6 · + context 1.3 s · pause .6 · new “ring” 1.3 s (= auto 4.8 s) */
var PART=[[0,1.0],[1.6,2.9],[3.5,4.8]];
function auPart(i){ var t=auOf(i)*autoOf(i); for(var k=PART.length-1;k>=0;k--){ if(t>=PART[k][0]) return k+clamp((t-PART[k][0])/(PART[k][1]-PART[k][0])); } return 0; }
function spOf(i){ if(i===cur) return stepsOf(i)?auPart(i):0; if(spLeave&&anim&&spLeave.i===i) return spLeave.v; return i<cur?stepsOf(i):0; }
/* “ring (alone)” on each slide: t = how much of its arrow is drawn, g = how grey it is */
function ringState(i){
  var id=SC[i]&&SC[i].id, v=spOf(i);
  if(id==='w1') return {t:ease(auOf(i)),g:0};                /* plays by itself: look up “ring” */
  if(id==='a1'||id==='a2') return {t:1,g:ease(clamp(v-2))};  /* part 3: the new vector; the initial one stays, grey */
  if(id==='cmp'||i>S.cmp-1) return {t:1,g:1};             /* starts where slide 7 ended; kept while fading out after slide 8 */
  return {t:0,g:0};
}
function render(P){
  var now=performance.now();
  if(vAnim){ var vk=clamp((now-vAnim.start)/vAnim.dur), ve=ease(vk);
    view.yaw=lerp(vAnim.y,vAnim.ty,ve); view.pitch=lerp(vAnim.p,vAnim.tp,ve); if(vk>=1) vAnim=null; }
  op(gTitle,1-R(P,0,.25));
  /* slide 2: sentence → underline (0.6 s) → pause → “jewellery?” → pause → “a phone sound?” */
  op(gQ,IN(P,S.q,.02,.12)*(1-IN(P,S.b,0,.25)));
  var ul=IN(P,S.q,.2,.4); set(qLine,{x1:qL.x1,y1:qL.y,x2:lerp(qL.x1,qL.x2,ul),y2:qL.y}); op(qLine,ul>0?1:0);
  op(qJ,IN(P,S.q,.53,.66)); op(qP,IN(P,S.q,.86,1));
  op(gB,IN(P,S.b,.1,.5)*(1-IN(P,S.s,0,.25)));
  op(gS,IN(P,S.s,.1,.5)*(1-IN(P,S.w1,0,.2)));

  var sp3=IN(P,S.w1,.05,.3);
  op(gSpace,sp3*(1-IN(P,S.sc,0,.25)));   /* the picture fades out on the move to slide 9 */
  var settled=Math.abs(P-cur)<1e-6;
  op(turnHint,(turnSlide(cur) && settled && !vTouched)?1:0);
  op(gRst,(turnSlide(cur) && settled)?1:0); op(gRep,(autoOf(cur) && settled)?1:0);
  op(wRing,IN(P,S.w1,.02,.3)*(1-IN(P,S.a1,0,.3)));
  var o=P3([0,0,0]), ra=P3(RING);
  if(sp3>0){
    AX_END.forEach(function(e,k){var p=P3(e); drawArrow(axA[k],o.x,o.y,p.x,p.y,1);});
    floor.forEach(function(f){var a=P3(f.a),b=P3(f.b); set(f.e,{x1:a.x,y1:a.y,x2:b.x,y2:b.y});});
    REF.forEach(function(r){var p=P3(r.v); set(r.dot,{cx:p.x,cy:p.y});});
    set(raDot,{cx:ra.x,cy:ra.y}); set(raDotG,{cx:ra.x,cy:ra.y});
    layoutLabels(turnSlide(cur)?cur:(cur>S.cmp-1?S.cmp-1:S.w1-1));   /* on slide 9: keep slide 8’s labels while they fade */
  }
  /* “ring (alone)”: blend the states of the two slides P is between */
  var i0=Math.floor(P), i1=Math.min(N-1,i0+1), f=P-i0, s0=ringState(i0), s1=ringState(i1);
  var rt=lerp(s0.t,s1.t,f), rg=lerp(s0.g,s1.g,f);
  drawArrow(ringA,o.x,o.y,ra.x,ra.y,rt); drawArrow(ringAG,o.x,o.y,ra.x,ra.y,rt);
  op(ringA.g,rt>0?1-rg:0); op(ringAG.g,rt>0?rg:0);
  var rd=R(rt,.85,1); op(raDot,rd*(1-rg)); op(raL,rd*(1-rg)); op(raDotG,rd*rg); op(raLG,rd*rg);

  /* slide 8 plays by itself, starting where slide 7 ended: the green arrow fades (0.6 s), then the orange “+ context” draws (1.2 s) */
  var cmpT=IN(P,S.cmp,0,1), uc=auOf(S.cmp-1)*2.1, greenOut=clamp(uc/.6), orange=ease(clamp((uc-.6)/1.2)), onDot=clamp((uc-1.7)/.3);
  SENT.forEach(function(s,si){
    var a=s.att-1, nxt=si===0?S.a2:S.cmp;
    var out=1-IN(P,nxt,0,.3), sIn=si===0?IN(P,s.att,.02,.3):IN(P,s.att,.3,.6), vis=sIn*out, aT=IN(P,s.att,0,.3);
    op(s.g,vis);
    var spa=spOf(a);
    /* slides 6 / 7: step 1 bars (how much “ring” listens), step 2 context arrow, step 3 the new “ring” */
    var bt=ease(clamp(spa))*IN(P,s.att,0,1);
    s.bars.forEach(function(b,j){set(b,{height:Math.max(bt>0?2:0,s.W[s.words[j]]*80*bt)});});
    op(s.gBars,aT); op(s.ta,aT*bt);

}

/* buttons in the picture (Reset view, ↻ Replay): click, or Enter / Space */
function onAct(g,fn){
  g.addEventListener('click',function(e){e.stopPropagation(); fn();});
  g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault(); e.stopPropagation(); fn();}});
}
/* reset-view button (walk slides), same look as deck 1 */
/* Reset view (right above the replay spot) and ↻ Replay (slides 5 and 8), in the same spots as deck 1 */
var gRst=el('g',{'class':'rbtn',role:'button',tabindex:'0','aria-label':'Reset view'});
el('rect',{x:1290,y:740,width:270,height:60,rx:30,'class':'f-bg s-link','stroke-width':2},gRst);
txt('↺  Reset view',{x:1425,y:779,'text-anchor':'middle','font-size':24,'class':'f-link b'},gRst).setAttribute('xml:space','preserve');
op(gRst,0);
var gRep=el('g',{'class':'rbtn',role:'button',tabindex:'0','aria-label':'Replay'});
el('rect',{x:1290,y:810,width:270,height:60,rx:30,'class':'f-bg s-link','stroke-width':2},gRep);
txt('↻  Replay',{x:1425,y:849,'text-anchor':'middle','font-size':24,'class':'f-link b'},gRep).setAttribute('xml:space','preserve');
op(gRep,0);
function viewHome(ms){   /* ease back to the normal view (shortest way round) */
  if(!view.yaw && !view.pitch) return;
  var y=Math.atan2(Math.sin(view.yaw),Math.cos(view.yaw));
  vAnim={y:y,p:view.pitch,ty:0,tp:0,start:performance.now(),dur:ms}; lastP=-1;
}
onAct(gRst,function(){viewHome(450);});
onAct(gRep,function(){auFreeze=null; auStart=performance.now(); dirty=true;});

/* walk slides: drag to turn the 3D space (mouse only). Never changes the slide. */
var svgEl=document.getElementById('svg');
svgEl.addEventListener('pointerdown',function(e){
  if(!turnSlide(cur) || Math.abs(P-cur)>1e-6 || e.pointerType!=='mouse' || e.button!==0) return;
  if(gRst.contains(e.target) || gRep.contains(e.target)) return;
  e.preventDefault(); vAnim=null;
  var x0=e.clientX, y0=e.clientY, yaw0=view.yaw, p0=view.pitch;
  try{svgEl.setPointerCapture(e.pointerId);}catch(_){}
  svgEl.classList.add('turning');
  function mv(ev){ view.yaw=yaw0+(ev.clientX-x0)*.008; view.pitch=Math.max(-.9,Math.min(.9,p0+(ev.clientY-y0)*.008)); vTouched=true; lastP=-1; }
  function up(){ svgEl.classList.remove('turning'); svgEl.removeEventListener('pointermove',mv); svgEl.removeEventListener('pointerup',up); svgEl.removeEventListener('pointercancel',up); }
  svgEl.addEventListener('pointermove',mv); svgEl.addEventListener('pointerup',up); svgEl.addEventListener('pointercancel',up);
});

/* ------------------------------------------------------------------ */
/* timeline + slide controls (Back / Next change the slide only)       */
/* ------------------------------------------------------------------ */
var anim=null;
var capK=document.getElementById('capK'), capT=document.getElementById('capT'), cap=document.getElementById('cap');
var prev=document.getElementById('prev'), next=document.getElementById('next'), count=document.getElementById('count'), dots=document.getElementById('dots');
var seen={0:1};
for(var d=0;d<N;d++){(function(d){var b=document.createElement('button'); b.type='button'; if(SC[d].sec>=0 && (d===0||SC[d-1].sec!==SC[d].sec)) b.classList.add('sec');   /* first slide of a trail part: bigger dot (session 4) */
   b.setAttribute('aria-label','Slide '+(d+1)+(SC[d].sec>=0?': '+SECS[SC[d].sec]:'')); b.addEventListener('click',function(){go(d);}); dots.appendChild(b);})(d);}
function trail(sec){
  capK.textContent='';
  SECS.forEach(function(s,i){
    if(i) {capK.appendChild(document.createTextNode(' ')); var sp=document.createElement('span'); sp.className='sep'; sp.textContent='›'; sp.setAttribute('aria-hidden','true'); capK.appendChild(sp); capK.appendChild(document.createTextNode(' '));}
    var e=document.createElement('span'); e.textContent=s; e.className=i<sec?'past':(i===sec?'now':'next');
    if(i===sec) e.setAttribute('aria-current','step');
    capK.appendChild(e);
  });
}
function ui(){
  var s=SC[cur];
  trail(s.sec); capT.textContent=cur===0?'':s.t;
  if(s.s){var sm=document.createElement('small'); sm.textContent=s.s; capT.appendChild(sm);}
  cap.style.visibility=cur===0?'hidden':'visible';
  cap.classList.remove('fade'); void cap.offsetWidth; cap.classList.add('fade');
  prev.disabled=false; prev.innerHTML=cur===0?'← <span class="lt">Back 1: </span>Embeddings':'← Back';   /* slide 1: back to deck 1 (short label on phones) */
  next.disabled=cur===N-1;
  count.textContent=(cur+1)+' / '+N;
  svgEl.classList.toggle('turn',turnSlide(cur));
  [].forEach.call(dots.children,function(b,i){if(i===cur) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); b.classList.toggle('seen',!!seen[i]);});
  try{history.replaceState(null,'','#'+(cur+1));}catch(e){}
}
function go(t){
  if(t<0){ location.href=PREV_DECK; return; }   /* ← / Back on slide 1: previous topic */
  t=Math.min(N-1,t); if(t===cur && !anim) return;
  var fwd=t===cur+1 && Math.abs(P-cur)<1e-6;
  var dur=reduce?.25:(fwd?DUR[t]:(t<cur?.6:.9));
  spLeave={i:cur,v:spOf(cur)};   /* slides 6 / 7 keep their picture while fading out */
  anim={from:P,to:t,start:performance.now(),dur:dur*1000,lin:fwd};
  if(!turnSlide(t)) viewHome(400);   /* the turned view is kept on the walk slides and eases back when leaving them */
  cur=t; seen[t]=1;
  auFreeze=null; auStart=fwd?performance.now()+dur*1000+150:-1e9;   /* auto slides: play once the slide has arrived (Back / a dot: finished) */
  ui();
}
function step(now){
  if(anim){
    var k=clamp((now-anim.start)/anim.dur);
    P=lerp(anim.from,anim.to,anim.lin?k:ease(k));
    if(k>=1){P=anim.to; anim=null; spLeave=null; dirty=true;}
  }
  if(autoOf(cur) && now<auStart+autoOf(cur)*1000+100) dirty=true;
  if(P!==lastP||anim||vAnim||dirty){ render(P); lastP=P; dirty=false; }
  requestAnimationFrame(step);
}
prev.addEventListener('click',function(){go(cur-1);});
next.addEventListener('click',function(){go(cur+1);});
document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  var k=e.key;
  if(e.target.closest && e.target.closest('.rbtn') && (k==='Enter'||k===' ')) return;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||(k==='Enter'&&e.target===document.body)){e.preventDefault(); go(cur+1);}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault(); go(cur-1);}
  else if(k==='Home'){go(0);} else if(k==='End'){go(N-1);}
  else if(k==='f'||k==='F'){fs();}
});
function fs(){try{if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();}catch(e){}}
document.getElementById('fsBtn').addEventListener('click',fs);
var rootEl=document.documentElement, tb=document.getElementById('themeBtn');
function isDark(){var t=rootEl.getAttribute('data-theme'); if(t) return t==='dark'; return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;}
function tl(){tb.setAttribute('aria-label',isDark()?'Switch to light mode':'Switch to dark mode');}
tb.addEventListener('click',function(){var t=isDark()?'light':'dark'; rootEl.setAttribute('data-theme',t); try{localStorage.setItem('cps845-theme',t);}catch(e){} tl();});
tl();
function layoutSentences(){   /* word positions from the real text widths (runs again once the web font has loaded) */
  SENT.forEach(function(s){var x=90; s.t.forEach(function(t,i){var w=t.getComputedTextLength?t.getComputedTextLength():80;
    set(t,{x:x}); set(s.bars[i],{x:x,width:w}); x+=w+22;});});
  [].forEach.call(document.querySelectorAll('#svg text'),function(t){t._w=null;});
  layoutQ(); layoutNew(); LAB.key=''; lastP=-1;
}
var hs=(location.hash||'').slice(1), h=hs==='end'?N:parseInt(hs,10);
if(h>=1&&h<=N){cur=h-1; P=cur; for(var s=0;s<=cur;s++) seen[s]=1;}
/* for testing: __setP(p) jumps to position p (slides shown finished); __au(u) freezes a slide that plays by itself at u (0…1);
   __sp(v) shows part v (0…3) of slides 6 / 7; __view(yaw,pitch) turns the space */
window.__setP=function(p){anim=null; spLeave=null; P=p; cur=Math.round(p); auFreeze=null; auStart=-1e9; ui(); render(P); lastP=P;};
window.__au=function(u){auFreeze=u; render(P); lastP=P;};
window.__sp=function(v){ var k=Math.min(PART.length-1,Math.max(0,Math.ceil(v)-1)), t=v<=0?0:PART[k][0]+clamp(v-k)*(PART[k][1]-PART[k][0]); auFreeze=autoOf(cur)?t/autoOf(cur):0; render(P); lastP=P;};
window.__state=function(){return {cur:cur,P:P,sp:+spOf(cur).toFixed(2),au:+auOf(cur).toFixed(2),anim:!!anim};};
window.__view=function(y,p){vAnim=null; view.yaw=y; view.pitch=p; vTouched=!!(y||p); render(P); lastP=P;};
window.__S=S;
layoutSentences();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layoutSentences);
ui(); render(P); requestAnimationFrame(step);
})();
